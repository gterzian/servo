# cbindgen configuration for ServoSwift

language = "C"
header = "/* This Source Code Form is subject to the terms of the Mozilla Public\n * License, v. 2.0. If a copy of the MPL was not distributed with this\n * file, You can obtain one at https://mozilla.org/MPL/2.0/. */\n\n#ifndef SERVO_SWIFT_BINDINGS_H\n#define SERVO_SWIFT_BINDINGS_H\n\n#include <stdint.h>\n#include <stdbool.h>\n"
trailer = "\n#endif /* SERVO_SWIFT_BINDINGS_H */"

[export]
include = ["ServoError", "ServoInitOptions", "ServoHandle", "WebViewHandle"]

[parse]
parse_deps = false
clean = false
include = ["cbindgen_exports"]
exclude = ["swift_bindings"]
